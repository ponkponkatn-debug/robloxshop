<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สุ่มรหัสได้/ไม่ได้ - LrapX HUB</title>
    <style>
        body {
            background: radial-gradient(circle at top, #0f172a 0%, #07090e 100%);
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 15px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
        }
        .logo span {
            color: #34d399;
        }
        .sub {
            color: #9ca3af;
            font-size: 13px;
            margin-top: 6px;
        }
        .card {
            background: rgba(20, 24, 36, 0.88);
            border: 1px solid rgba(16, 185, 129, 0.28);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: #34d399;
            margin-bottom: 12px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
        }
        button {
            border: none;
            border-radius: 10px;
            padding: 13px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn-roll {
            flex: 1;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #06120d;
        }
        .btn-clear {
            background: #1f2937;
            color: #e5e7eb;
            border: 1px solid #374151;
        }
        .result-box {
            margin-top: 14px;
            background: #080a0f;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 16px;
            font-family: monospace;
            font-size: 14px;
            min-height: 48px;
            white-space: pre-line;
        }
        .win {
            color: #34d399;
            font-weight: 700;
        }
        .lose {
            color: #f87171;
            font-weight: 700;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #080a0f;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 10px 12px;
            margin-top: 8px;
            font-family: monospace;
            font-size: 12px;
        }
        .copy-btn {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.4);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">LrapX <span>CODE ROLL</span></div>
            <div class="sub">สุ่มรหัส • มีโอกาสได้กับไม่ได้ • ดูประวัติย้อนหลังได้</div>
        </div>

        <div class="card">
            <div class="card-title">สุ่มรหัส</div>
            <div class="btn-row">
                <button type="button" class="btn-roll" id="rollBtn">กดสุ่มรหัส</button>
                <button type="button" class="btn-clear" id="clearBtn">ล้างประวัติ</button>
            </div>
            <div id="resultBox" class="result-box">กด "กดสุ่มรหัส" เพื่อดูว่าได้หรือไม่ได้...</div>
        </div>

        <div class="card">
            <div class="card-title">ประวัติการสุ่ม</div>
            <div id="historyBox">
                <div class="result-box">ยังไม่มีประวัติ</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var STORAGE_KEY = "lrapx_simple_code_history";
            var SAMPLE_CODES = [
                "sjdudjus:6282828",
                "lrapxvip:9041725",
                "deltarun:3819402",
                "minikeys:7741209",
                "aimbotpro:5192834"
            ];
            var memoryList = [];

            function loadHistory() {
                try {
                    var raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        var parsed = JSON.parse(raw);
                        if (Array.isArray(parsed)) memoryList = parsed;
                    }
                } catch (e) {}
                return memoryList;
            }

            function saveHistory(list) {
                memoryList = list;
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
                } catch (e) {}
                renderHistory();
            }

            function copyCode(text) {
                if (!text) return;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function() {
                        alert("คัดลอกแล้ว: " + text);
                    }, function() {
                        prompt("คัดลอกรหัสนี้:", text);
                    });
                } else {
                    prompt("คัดลอกรหัสนี้:", text);
                }
            }

            function renderHistory() {
                var list = loadHistory();
                var box = document.getElementById("historyBox");
                if (!box) return;
                if (!list.length) {
                    box.innerHTML = '<div class="result-box">ยังไม่มีประวัติ</div>';
                    return;
                }
                box.innerHTML = "";
                for (var i = 0; i < list.length; i++) {
                    var item = list[i];
                    var row = document.createElement("div");
                    row.className = "history-item";

                    var info = document.createElement("div");
                    var statusSpan = document.createElement("div");
                    statusSpan.className = item.got ? "win" : "lose";
                    statusSpan.textContent = item.got ? ("ได้: " + item.code) : "ไม่ได้";

                    var timeSpan = document.createElement("div");
                    timeSpan.style.color = "#9ca3af";
                    timeSpan.style.fontSize = "11px";
                    timeSpan.textContent = item.time;

                    info.appendChild(statusSpan);
                    info.appendChild(timeSpan);
                    row.appendChild(info);

                    if (item.got && item.code) {
                        var btn = document.createElement("button");
                        btn.type = "button";
                        btn.className = "copy-btn";
                        btn.textContent = "คัดลอก";
                        (function(c) {
                            btn.addEventListener("click", function() {
                                copyCode(c);
                            });
                        })(item.code);
                        row.appendChild(btn);
                    }

                    box.appendChild(row);
                }
            }

            function makeRandomCode() {
                if (Math.random() < 0.4) {
                    return SAMPLE_CODES[Math.floor(Math.random() * SAMPLE_CODES.length)];
                }
                var chars = "abcdefghijklmnopqrstuvwxyz";
                var left = "";
                for (var i = 0; i < 8; i++) {
                    left += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                var right = String(Math.floor(1000000 + Math.random() * 9000000));
                return left + ":" + right;
            }

            function handleRoll() {
                var box = document.getElementById("resultBox");
                var now = new Date().toLocaleString();
                var got = Math.random() < 0.5;
                var code = got ? makeRandomCode() : "";

                if (got) {
                    box.innerHTML = '<span class="win">ได้รหัส!</span>\nรหัส: ' + code + '\nเวลา: ' + now;
                } else {
                    box.innerHTML = '<span class="lose">ไม่ได้</span>\nรอบนี้สุ่มไม่ติด\nเวลา: ' + now;
                }

                var next = loadHistory().slice();
                next.unshift({ got: got, code: code, time: now });
                saveHistory(next.slice(0, 30));
            }

            var rollBtn = document.getElementById("rollBtn");
            var clearBtn = document.getElementById("clearBtn");

            if (rollBtn) {
                rollBtn.addEventListener("click", handleRoll);
            }
            if (clearBtn) {
                clearBtn.addEventListener("click", function() {
                    saveHistory([]);
                    var box = document.getElementById("resultBox");
                    if (box) box.textContent = 'กด "กดสุ่มรหัส" เพื่อดูว่าได้หรือไม่ได้...';
                });
            }

            renderHistory();
        })();
    </script>
</body>
</html>
