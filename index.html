<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINI SHOP - Roblox Store</title>
    <style>
        body { background-color: #0b0d12; color: #ffffff; font-family: sans-serif; margin: 0; padding: 12px; }
        .shop-banner { background: linear-gradient(135deg, #1e150c, #2d1808); border: 1px solid #d97706; border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 12px; }
        .shop-banner h2 { color: #fbbf24; margin: 0 0 5px 0; font-size: 20px; }
        .shop-banner p { color: #9ca3af; font-size: 12px; margin: 0; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .stat-box { background: #141824; border: 1px solid #1f293d; border-radius: 10px; padding: 12px; }
        .stat-label { font-size: 11px; color: #9ca3af; margin-bottom: 4px; }
        .stat-value { font-size: 18px; font-weight: bold; color: #f59e0b; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .menu-btn { background: #141824; border: 1px solid #1f293d; border-radius: 10px; padding: 12px; text-align: center; text-decoration: none; color: #ffffff; font-weight: bold; font-size: 14px; display: block; }
    </style>
</head>
<body>
    <div class="shop-banner">
        <h2>🔥 MINI SHOP 🔥</h2>
        <p>รหัส Roblox มือสองพร้อมเล่น ปลอดภัย 100%</p>
    </div>
    <div class="stats-grid">
        <div class="stat-box"><div class="stat-label">ผู้ใช้งาน</div><div class="stat-value">1,245 คน</div></div>
        <div class="stat-box"><div class="stat-label">เวลาเปิดบริการ</div><div class="stat-value" style="font-size: 13px; color: #34d399;">12:30 - 19:40</div></div>
    </div>
    <div class="menu-grid">
        <a href="#" class="menu-btn">🛍️ สินค้า</a>
        <a href="#" class="menu-btn">💳 เติมเงิน</a>
        <a href="#" class="menu-btn">❓ ช่วยเหลือ</a>
        <a href="#" class="menu-btn">💬 ติดต่อ</a>
    </div>
</body>
</html>
