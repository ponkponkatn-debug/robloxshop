<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniScript - Delta Executor Optimized OBF by LrapX HUB</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-bg: #141824;
            --border-color: #1f293d;
            --accent-green: #10b981;
            --accent-glow: #34d399;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            padding: 20px 10px;
            background: linear-gradient(180deg, #111e18 0%, var(--bg-color) 100%);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: var(--accent-glow);
            margin-bottom: 5px;
            text-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
        }

        .credit-badge {
            display: inline-block;
            background: #064e3b;
            color: #34d399;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--accent-green);
        }

        .sub-title {
            color: var(--text-muted);
            font-size: 13px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .obf-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .options-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        label {
            font-size: 13px;
            color: var(--accent-glow);
            font-weight: bold;
        }

        select {
            background: #0b0d12;
            color: #fff;
            border: 1px solid var(--accent-green);
            border-radius: 6px;
            padding: 6px 12px;
            outline: none;
            font-size: 13px;
        }

        textarea {
            width: 100%;
            height: 250px;
            background: #08090d;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #34d399;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-green);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-primary {
            background: var(--accent-green);
            color: #0b0d12;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #1f293d;
            color: #fff;
        }

        .btn-secondary:active {
            transform: scale(0.98);
        }

        .footer-credit {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }

        .footer-credit span {
            color: var(--accent-glow);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="credit-badge">POWERED BY LRAPX HUB</div>
        <div class="logo">⚡ MiniScript OBF (Delta Edition)</div>
        <div class="sub-title">ระบบครอบโค้ดปรับแต่งพิเศษ รองรับ Delta Executor บนมือถือ 100%</div>
    </div>

    <div class="container">
        <!-- Input Section -->
        <div class="obf-card">
            <div class="options-bar">
                <label>📌 วางโค้ด Lua ของคุณที่นี่:</label>
                <div>
                    <label for="level">Mode: </label>
                    <select id="level">
                        <option value="delta" selected>🟢 Delta Mobile Secure</option>
                    </select>
                </div>
            </div>
            <textarea id="inputLua" placeholder="-- วางโค้ด Lua ของคุณลงที่นี่...&#10;print('Hello from LrapX HUB')"></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" type="button" onclick="runObfuscate()">🛡️ เริ่มครอบโค้ด (DELTA OBF)</button>
                <button class="btn btn-secondary" type="button" onclick="clearInput()">🗑️ ล้างข้อความ</button>
            </div>
        </div>

        <!-- Output Section -->
        <div class="obf-card">
            <div class="options-bar">
                <label>✅ ผลลัพธ์โค้ดสำหรับรันใน Delta:</label>
            </div>
            <textarea id="outputLua" readonly placeholder="-- ผลลัพธ์จะแสดงที่นี่..."></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" type="button" onclick="copyOutput()">📋 คัดลอกโค้ด (COPY)</button>
                <button class="btn btn-secondary" type="button" onclick="downloadLua()">💾 ดาวน์โหลดไฟล์</button>
            </div>
        </div>
    </div>

    <div class="footer-credit">
        Developed & Managed by <span>LrapX HUB</span> | MiniScript © 2026
    </div>

    <script>
        // ฟังก์ชันเข้ารหัส Base64 แบบปลอดภัยรองรับภาษาไทยและอักขระพิเศษ
        function safeBtoa(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                return String.fromCharCode('0x' + p1);
            }));
        }

        function runObfuscate() {
            var inputElem = document.getElementById('inputLua');
            var outputElem = document.getElementById('outputLua');

            if (!inputElem || !outputElem) return;
            var code = inputElem.value;

            if (!code || code.trim() === "") {
                alert('กรุณาวางโค้ด Lua ก่อนกดครอบโค้ดครับ!');
                return;
            }

            var header = "--[[\n" +
                         "   ===================================================\n" +
                         "   Protected by LrapX HUB Obfuscator (Delta Edition)\n" +
                         "   Optimized for Delta Executor Mobile\n" +
                         "   Timestamp: " + new Date().toLocaleString() + "\n" +
                         "   ===================================================\n" +
                         "]]--\n\n";

            try {
                // เข้ารหัส Base64 ป้องกันการอ่านออกและรองรับ Delta VM
                var encoded = safeBtoa(code);
                
                var v1 = "LrapX_" + Math.floor(Math.random() * 900000 + 100000);
                var v2 = "LrapX_" + Math.floor(Math.random() * 900000 + 100000);

                var result = "local " + v1 + " = \"" + encoded + "\"\n" +
                             "local function " + v2 + "(data)\n" +
                             "    local b = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'\n" +
                             "    data = string.gsub(data, '[^'..b..'=]', '')\n" +
                             "    return (data:gsub('.', function(x)\n" +
                             "        if (x == '=') then return '' end\n" +
                             "        local r,f='',(b:find(x)-1)\n" +
                             "        for i=6,1,-1 do r=r..(f%2^i-f%2^(i-1)>0 and '1' or '0') end\n" +
                             "        return r;\n" +
                             "    end):gsub('%d%d%d?%d?%d?%d?%d?%d?', function(x)\n" +
                             "        if (#x ~= 8) then return '' end\n" +
                             "        local c=0\n" +
                             "        for i=1,8 do c=c+(x:sub(i,i)=='1' and 2^(8-i) or 0) end\n" +
                             "        return string.char(c)\n" +
                             "    end))\n" +
                             "end\n" +
                             "local success, res = pcall(function()\n" +
                             "    local decoded = " + v2 + "(" + v1 + ")\n" +
                             "    return loadstring(decoded)()\n" +
                             "end)\n" +
                             "if not success then\n" +
                             "    warn('[LrapX HUB Error]: ' .. tostring(res))\n" +
                             "end";

                outputElem.value = header + result;
                alert('🛡️ ครอบโค้ดแบบ Delta Optimized สำเร็จ รันติดแน่นอน!');
            } catch (err) {
                alert('เกิดข้อผิดพลาด: ' + err.message);
            }
        }

        function clearInput() {
            document.getElementById('inputLua').value = '';
            document.getElementById('outputLua').value = '';
        }

        function copyOutput() {
            var output = document.getElementById('outputLua');
            if (!output.value) {
                alert('ยังไม่มีโค้ดให้คัดลอกครับ!');
                return;
            }
            navigator.clipboard.writeText(output.value).then(function() {
                alert('📋 คัดลอกโค้ดสำเร็จ!');
            }, function() {
                output.select();
                document.execCommand('copy');
                alert('📋 คัดลอกโค้ดสำเร็จ!');
            });
        }

        function downloadLua() {
            var text = document.getElementById('outputLua').value;
            if (!text) {
                alert('ยังไม่มีโค้ดให้ดาวน์โหลดครับ!');
                return;
            }
            var blob = new Blob([text], { type: "text/plain;charset=utf-8" });
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "Protected_LrapX_Delta.lua";
            a.click();
        }
    </script>
</body>
</html>
