<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniScript - Lua Obfuscator by LrapX HUB</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-bg: #141824;
            --border-color: #1f293d;
            --accent-green: #10b981;
            --accent-glow: #34d399;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            padding: 20px 10px;
            background: linear-gradient(180deg, #111e18 0%, var(--bg-color) 100%);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: var(--accent-glow);
            margin-bottom: 5px;
            text-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
        }

        .credit-badge {
            display: inline-block;
            background: #064e3b;
            color: #34d399;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--accent-green);
        }

        .sub-title {
            color: var(--text-muted);
            font-size: 13px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .obf-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .options-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        label {
            font-size: 13px;
            color: var(--accent-glow);
            font-weight: bold;
        }

        select {
            background: #0b0d12;
            color: #fff;
            border: 1px solid var(--accent-green);
            border-radius: 6px;
            padding: 6px 12px;
            outline: none;
            font-size: 13px;
        }

        textarea {
            width: 100%;
            height: 200px;
            background: #08090d;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #34d399;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-green);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-primary {
            background: var(--accent-green);
            color: #0b0d12;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #1f293d;
            color: #fff;
        }

        .btn-secondary:active {
            transform: scale(0.98);
        }

        .footer-credit {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }

        .footer-credit span {
            color: var(--accent-glow);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="credit-badge">POWERED BY LRAPX HUB</div>
        <div class="logo">⚡ MiniScript OBF</div>
        <div class="sub-title">ระบบครอบพรางโค้ด Roblox Lua (Anti-Steal Protection)</div>
    </div>

    <div class="container">
        <!-- Input Section -->
        <div class="obf-card">
            <div class="options-bar">
                <label>📌 วางโค้ด Lua ของคุณที่นี่:</label>
                <div>
                    <label for="level">Level: </label>
                    <select id="level">
                        <option value="light">Light</option>
                        <option value="medium" selected>Medium</option>
                        <option value="heavy">Heavy</option>
                    </select>
                </div>
            </div>
            <textarea id="inputLua" placeholder="-- วางโค้ด Lua ของคุณลงที่นี่...&#10;print('Hello from LrapX HUB')"></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" type="button" onclick="runObfuscate()">🔒 ครอบโค้ด (OBFUSCATE)</button>
                <button class="btn btn-secondary" type="button" onclick="clearInput()">🗑️ ล้างข้อความ</button>
            </div>
        </div>

        <!-- Output Section -->
        <div class="obf-card">
            <div class="options-bar">
                <label>✅ ผลลัพธ์โค้ดที่ครอบแล้ว:</label>
            </div>
            <textarea id="outputLua" readonly placeholder="-- ผลลัพธ์จะแสดงที่นี่..."></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" type="button" onclick="copyOutput()">📋 คัดลอกโค้ด (COPY)</button>
                <button class="btn btn-secondary" type="button" onclick="downloadLua()">💾 ดาวน์โหลดไฟล์</button>
            </div>
        </div>
    </div>

    <div class="footer-credit">
        Developed & Managed by <span>LrapX HUB</span> | MiniScript © 2026
    </div>

    <script>
        function runObfuscate() {
            var inputElem = document.getElementById('inputLua');
            var outputElem = document.getElementById('outputLua');
            var levelElem = document.getElementById('level');

            if (!inputElem || !outputElem || !levelElem) {
                alert('เกิดข้อผิดพลาดในการโหลดองค์ประกอบเว็บ');
                return;
            }

            var code = inputElem.value;
            var level = levelElem.value;

            if (!code || code.trim() === "") {
                alert('กรุณาวางโค้ด Lua ก่อนกดครอบโค้ดครับ!');
                return;
            }

            var header = "--[[\n   Protected by LrapX HUB Obfuscator\n]]--\n\n";
            var result = "";

            try {
                if (level === "light") {
                    var encoded = "";
                    for (var i = 0; i < code.length; i++) {
                        encoded += "\\" + code.charCodeAt(i);
                    }
                    result = 'local _s = "' + encoded + '"\nlocal _d = ""\nfor v in _s:gmatch("\\\\(%d+)") do _d = _d .. string.char(v) end\nloadstring(_d)()';
                } 
                else if (level === "medium") {
                    var bytes = [];
                    for (var i = 0; i < code.length; i++) {
                        bytes.push(code.charCodeAt(i));
                    }
                    var randVar = "LrapX_" + Math.floor(Math.random() * 99999);
                    result = "local " + randVar + " = {" + bytes.join(",") + "}\n" +
                             "local _code = ''\n" +
                             "for _, b in ipairs(" + randVar + ") do _code = _code .. string.char(b) end\n" +
                             "loadstring(_code)()";
                } 
                else {
                    var bytes = [];
                    for (var i = 0; i < code.length; i++) {
                        bytes.push(code.charCodeAt(i) ^ 7);
                    }
                    result = "local _x = {" + bytes.join(",") + "}\n" +
                             "local _c = ''\n" +
                             "for i = 1, #_x do _c = _c .. string.char(_x[i] ~ 7) end\n" +
                             "loadstring(_c)()";
                }

                outputElem.value = header + result;
                alert('✅ ครอบโค้ดสำเร็จแล้วโดย LrapX HUB!');
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการประมวลผล: ' + err.message);
            }
        }

        function clearInput() {
            document.getElementById('inputLua').value = '';
            document.getElementById('outputLua').value = '';
        }

        function copyOutput() {
            var output = document.getElementById('outputLua');
            if (!output.value) {
                alert('ยังไม่มีโค้ดให้คัดลอกครับ!');
                return;
            }
            navigator.clipboard.writeText(output.value).then(function() {
                alert('📋 คัดลอกโค้ดสำเร็จ!');
            }, function() {
                output.select();
                document.execCommand('copy');
                alert('📋 คัดลอกโค้ดสำเร็จ!');
            });
        }

        function downloadLua() {
            var text = document.getElementById('outputLua').value;
            if (!text) {
                alert('ยังไม่มีโค้ดให้ดาวน์โหลดครับ!');
                return;
            }
            var blob = new Blob([text], { type: "text/plain;charset=utf-8" });
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "Protected_Script.lua";
            a.click();
        }
    </script>
</body>
</html>
